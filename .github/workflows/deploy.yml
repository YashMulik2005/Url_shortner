name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # OPTIONAL CI step (can skip if not needed)
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e   # stop on error

            echo "Move to root user"
            sudo su

            echo "Go to project directory"
            cd /home/ubuntu/Url_shortner

            echo "Fix git safe directory issue"
            git config --global --add safe.directory /home/ubuntu/Url_shortner

            echo "Pull latest code"
            git pull origin main

            echo "Backend setup"
            cd backend
            npm ci

            echo "Restart backend safely"
            pm2 reload backend || pm2 start index.js --name backend

            echo "Frontend build"
            cd ../frontend
            npm ci
            npm run build

            echo "Update nginx files safely"
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/Url_shortner/frontend/dist/* /var/www/html/

            echo "Fix permissions"
            sudo chown -R www-data:www-data /var/www/html

            echo "Restart nginx"
            sudo systemctl restart nginx

            echo "Deployment completed successfully"
