name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Url_shortner

            echo "Pull latest code"
            git pull origin main

            echo "Backend setup"
            cd backend
            npm install
            pm2 restart backend

            echo "Frontend build"
            cd ../frontend
            npm install
            npm run build

            echo "Update nginx files"
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/Url_shortner/frontend/build/* /var/www/html/

            echo "Reload nginx"
            sudo systemctl restart nginx
